# scripts/load-test.sh only does 500 curls to taskboard.local, not enough to move cpu,
# so this runs busybox pods hitting the backend in a loop
apiVersion: apps/v1
kind: Deployment
metadata:
  name: load-generator
  namespace: taskboard
spec:
  replicas: 6
  selector:
    matchLabels: {app: load-generator}
  template:
    metadata:
      labels: {app: load-generator}
    spec:
      containers:
        - name: busybox
          image: busybox:1.36
          command: ["/bin/sh", "-c", "while true; do wget -q -O /dev/null http://backend:8000/api/tasks; done"]
