apiVersion: v1
kind: Namespace
metadata:
  name: other
---
apiVersion: v1
kind: Pod
metadata:
  name: dns-client
  namespace: other
spec:
  containers:
    - name: busybox
      image: busybox:1.36
      # web-service is in default namespace, this pod is in "other"
      command: ["sh", "-c", "while true; do wget -q -T 3 -O /dev/null http://web-service && echo OK || echo FAILED; sleep 5; done"]
