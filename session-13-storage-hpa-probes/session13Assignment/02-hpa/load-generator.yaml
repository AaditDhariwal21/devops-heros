# busybox pods that keep hitting the service in a loop
apiVersion: apps/v1
kind: Deployment
metadata:
  name: load-generator
spec:
  replicas: 8   # 3 was only giving ~41% cpu, not enough
  selector:
    matchLabels:
      app: load-generator
  template:
    metadata:
      labels:
        app: load-generator
    spec:
      containers:
        - name: busybox
          image: busybox:1.36
          command: ["/bin/sh", "-c", "while true; do wget -q -O- http://hpa-demo-service > /dev/null; done"]
